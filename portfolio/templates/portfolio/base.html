<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}FreelanceAI{% endblock %}</title><style>
:root{color-scheme:dark;--bg:#080c16;--panel:#111a2b;--line:#28344a;--text:#f4f7ff;--muted:#aab6cc;--cyan:#58edff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1b2650 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 Inter,"Segoe UI",sans-serif}a{color:var(--cyan);text-decoration:none}.wrap{width:min(1050px,92%);margin:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid var(--line);gap:20px}.brand{font-weight:900;font-size:22px;color:white}.brand span{color:var(--cyan)}.links{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.main{padding:38px 0 70px}.panel{background:#111a2be8;border:1px solid var(--line);border-radius:16px;padding:24px;margin:16px 0}.field{margin:14px 0}label{display:block;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#080e1b;color:white}button,.btn{display:inline-block;border:0;border-radius:8px;padding:11px 16px;background:var(--cyan);color:#071019;font-weight:750;cursor:pointer}.btn-muted{background:#26334b;color:white}.errorlist{color:#ff9cae}.messages{padding:12px;border:1px solid #286b5a;border-radius:8px}.muted{color:var(--muted)}.row{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}small{color:var(--muted)}
</style></head><body><div class="wrap"><header class="nav"><a class="brand" href="/">Freelance<span>AI</span></a><nav class="links"><a href="/">Projects</a>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'create_private_request' %}">Private request</a><form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn-muted" type="submit">Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a><a class="btn" href="{% url 'register' %}">Create account</a>{% endif %}</nav></header>{% if messages %}{% for message in messages %}<p class="messages">{{ message }}</p>{% endfor %}{% endif %}<main class="main">{% block content %}{% endblock %}</main><footer class="muted">FreelanceAI · Secure customer workspace</footer></div></body></html>
