{% extends 'portfolio/base.html' %}{% block title %}Log in · FreelanceAI{% endblock %}{% block content %}<section class="panel" style="max-width:620px;margin:0 auto"><h1>Log in</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button type="submit">Log in</button><input type="hidden" name="next" value="{{ next }}"></form><p class="muted">New here? <a href="{% url 'register' %}">Create an account</a>.</p></section>{% endblock %}
